<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review — YouTube Buddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

    <!-- Navigation -->
    <nav class="app-nav" aria-label="Hauptnavigation">
      <span class="nav-brand"><span class="brand-dot" aria-hidden="true"></span>YouTube Buddy</span>
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a class="nav-item" href="#" title="Bibliothek (nicht Teil des Prototyps)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 4v14"/></svg>
        <span>Bibliothek</span>
      </a>
      <a class="nav-item" href="#" title="Suche (nicht Teil des Prototyps)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Suche</span>
      </a>
      <a class="nav-item" href="knowledge.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
        <span>Wissen</span>
      </a>
      <a class="nav-item" href="#" title="Mehr (nicht Teil des Prototyps)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>Mehr</span>
      </a>
    </nav>

    <main class="app-content">

      <!-- Header mit Fortschritt -->
      <header class="app-header">
        <div>
          <h1 class="text-title-1">Review</h1>
          <p class="text-caption text-secondary">7 von 14 Karten</p>
        </div>
        <div class="header-actions">
          <a class="icon-button" href="index.html" aria-label="Review beenden" title="Beenden">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </a>
        </div>
      </header>

      <div class="review-progress" role="img" aria-label="Fortschritt: 7 von 14 Karten geschafft">
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width: 50%"></div></div>
      </div>

      <!-- Flashcard: reiner CSS-Flip über versteckte Checkbox -->
      <label class="flashcard" aria-label="Flashcard — zum Wenden tippen">
        <input type="checkbox" class="flip-toggle">
        <span class="flashcard-inner">
          <span class="face face-front">
            <span class="face-label">Frage</span>
            <span class="question">Wofür steht der „Zwei-Minuten-Start" beim Aufbau neuer Gewohnheiten?</span>
          </span>
          <span class="face face-back">
            <span class="face-label">Antwort</span>
            <span class="answer">Die neue Gewohnheit auf eine Version reduzieren, die unter zwei Minuten dauert — z.&nbsp;B. „Laufschuhe anziehen" statt „5&nbsp;km laufen".</span>
            <span class="source-line">
              aus: Atomic Habits — Die 4 Gesetze einfach erklärt
              <span class="ts-chip">04:12</span>
            </span>
          </span>
        </span>
      </label>

      <p class="tap-hint">Tippe zum Wenden</p>

      <!-- SRS-Buttons -->
      <div class="srs-buttons">
        <button class="srs-btn srs-again" type="button">
          <span class="srs-icon" aria-hidden="true">↺</span>
          <span>Nochmal</span>
        </button>
        <button class="srs-btn srs-hard" type="button">
          <span class="srs-icon" aria-hidden="true">!!</span>
          <span>Schwer</span>
        </button>
        <button class="srs-btn srs-good" type="button">
          <span class="srs-icon" aria-hidden="true">✓</span>
          <span>Gut</span>
        </button>
        <button class="srs-btn srs-easy" type="button">
          <span class="srs-icon" aria-hidden="true">★</span>
          <span>Leicht</span>
        </button>
      </div>

      <!-- Streak (dezent) -->
      <p class="streak-line">
        <span class="streak-flame" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2c1 4-4 6-4 10a4 4 0 0 0 8 0c0-2-1-3-1-3s3 1 3 4.5A6.5 6.5 0 0 1 5.5 13C5.5 7 11 6 12 2z"/></svg>
        </span>
        Streak: 5 Tage · Retention 86&nbsp;%
      </p>

    </main>
  </div>
</body>
</html>
